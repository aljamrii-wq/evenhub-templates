[project]
name = "aura-engine"
version = "0.1.0"
description = "Aura smart glasses backend — Arabic bitmap rendering, Hermes WebSocket bridge, mode detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "Pillow>=10.0.0",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["engine"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = [".venv"]
