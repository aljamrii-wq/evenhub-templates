name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript-matrix:
    name: TypeScript (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [aura-sdk, minimal, asr, image, text-heavy]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check directory exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::${{ matrix.dir }}: no package.json — skipping"
          fi
      - name: Setup Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: npm install --no-audit --no-fund
      - name: TypeScript build
        if: steps.check.outputs.exists == 'true'
        run: |
          if grep -q '"build"' package.json; then
            npm run build
          else
            npx tsc --noEmit
          fi
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: |
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "No test script — skipping"
          fi

  typescript-gate:
    name: TypeScript (SDK + Templates)
    runs-on: ubuntu-latest
    needs: typescript-matrix
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.typescript-matrix.result }}" = "success" ] || [ "${{ needs.typescript-matrix.result }}" = "skipped" ]; then
            echo "TypeScript matrix: ${{ needs.typescript-matrix.result }}"
            exit 0
          else
            echo "TypeScript matrix failed: ${{ needs.typescript-matrix.result }}"
            exit 1
          fi

  python:
    name: Python (Engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check directory exists
        id: check
        run: |
          if [ -f requirements.txt ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::engine: no requirements.txt — skipping"
          fi
      - name: Setup Python
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install
        if: steps.check.outputs.exists == 'true'
        run: pip install -r requirements.txt
      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: python -m pytest -v
